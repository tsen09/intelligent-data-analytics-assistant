# ============================================================================
# Kathy - Intelligent Data Analytics Assistant
# ============================================================================

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "Kathy"
version = "0.1.0"
description = "An intelligent, database-agnostic assistant for natural-language enterprise analytics and SQL generation."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

authors = [
    { name = "Tanmoy Sen", email = "sentanmoy09@gmail.com" },
]

keywords = [
    "data-analytics",
    "enterprise-analytics",
    "business-intelligence",
    "natural-language-to-sql",
    "text-to-sql",
    "sql-generation",
    "sql-comprehension",
    "database-agnostic",
    "conversational-ai",
    "decision-support",
    "artificial-intelligence",
    "fastapi",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# ============================================================================
# Production Dependencies
# ============================================================================

dependencies = [
    # Backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",

    # Configuration and validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "jinja2>=3.1.6",
]

# ============================================================================
# Development Dependencies
# ============================================================================

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

# ============================================================================
# Ruff Configuration
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

# ============================================================================
# Pytest Configuration
# ============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ============================================================================
# uv Configuration
# ============================================================================

[tool.uv]
package = false

# ============================================================================
# Project URLs
# ============================================================================

[project.urls]
Homepage = "https://github.com/tsen09/intelligent-data-analytics-assistant"
Repository = "https://github.com/tsen09/intelligent-data-analytics-assistant"
Issues = "https://github.com/tsen09/intelligent-data-analytics-assistant/issues"
